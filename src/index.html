<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/home.css">
    <title>Vanguard</title>
</head>

<body>
    <header>
        <h1>
            <a href="#" class="logo_enlace">Vanguard</a>
        </h1>
        <form action="#" method="get" class="buscador">
            <input type="text" name="buscar-input" id="buscar-input" placeholder="Buscador con sugerencias">
            <button type="submit" class="boton_buscar">
                <img src="assets/icons/lupa.png" alt="Lupa" id="lupaBuscador">
            </button>
        </form>
        <button class="contenedores_iniciar">
            <img src="assets/icons/perfil.png" alt="usuario" id="IconosInicioCabecera">
            <p>Ingresar / Registrarse</p>
        </button>
        <button class="contenedores_iniciar">
            <img src="assets/icons/favorito.png" alt="favorito" id="IconosInicioCabecera">
            Favoritos
        </button>
        <button class="contenedores_iniciar">
            <img src="assets/icons/carro-de-la-compra.png" alt="carrito" id="IconosInicioCabecera">
            Carrito
        </button>
    </header>

    <main>
        <p>hola</p>
    </main>
</body>

</html>
